<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js WebGPU Compute Particles</title>
    <script src="views://playgrounds/threejs-webgpu/index.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a1a;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: #111127;
            border-bottom: 1px solid #2a2a4a;
            flex-shrink: 0;
        }
        .toolbar h1 {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            margin-right: auto;
        }
        .toolbar .badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 999px;
            background: #6366f1;
            color: #fff;
            font-weight: 600;
        }
        .toolbar .status {
            font-size: 12px;
            color: #888;
        }
        .toolbar .fps {
            font-size: 12px;
            color: #4ade80;
            font-variant-numeric: tabular-nums;
            min-width: 50px;
        }
        button {
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #3a3a5a;
            border-radius: 5px;
            background: #1a1a3a;
            color: #ddd;
        }
        button:hover { background: #252550; }
        .done-btn {
            background: #4ade80;
            border: none;
            color: #0a0a1a;
        }
        .done-btn:hover { background: #22c55e; }
        canvas {
            flex: 1;
            width: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <h1>Compute Particles</h1>
        <span class="badge">200k / WebGPU + TSL</span>
        <span class="status" id="status">Status: loading...</span>
        <span class="fps" id="fps"></span>
        <button id="toggleAnimBtn">Pause</button>
        <button id="doneBtn" class="done-btn">Done</button>
    </div>
    <canvas id="canvas"></canvas>
</body>
</html>
